<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/app-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>书签匠</title>
    <style>
      :root { color: #19223a; background: #eef1f6; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #eef1f6; }
      #app { width: 100%; height: 100%; opacity: 0; transition: opacity 220ms ease; }
      #startup-screen {
        position: fixed;
        z-index: 10000;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, rgb(255 255 255 / 94%) 0, rgb(244 246 255 / 94%) 34%, transparent 68%),
          linear-gradient(145deg, #f5f7ff, #e9edf6);
        opacity: 1;
        visibility: visible;
        transition: opacity 320ms ease, visibility 320ms step-end;
      }
      #startup-screen::before,
      #startup-screen::after {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        border: 1px solid rgb(70 88 214 / 8%);
        border-radius: 50%;
      }
      #startup-screen::before { transform: translate(-290px, -250px); }
      #startup-screen::after { transform: translate(310px, 260px) scale(.72); }
      .startup-card {
        position: relative;
        z-index: 1;
        width: 280px;
        display: grid;
        justify-items: center;
        color: #19223a;
        font-family: Inter, "Segoe UI Variable", "Microsoft YaHei UI", sans-serif;
        text-align: center;
      }
      .startup-mark {
        width: 66px;
        height: 66px;
        display: block;
        filter: drop-shadow(0 14px 20px rgb(48 65 154 / 23%));
        animation: startup-breathe 1.8s ease-in-out infinite;
      }
      .startup-card h1 {
        margin: 18px 0 5px;
        font-size: 24px;
        font-weight: 760;
        letter-spacing: .5px;
      }
      .startup-card p { margin: 0; color: #667085; font-size: 12px; letter-spacing: .4px; }
      .startup-progress {
        width: 168px;
        height: 3px;
        margin: 22px 0 11px;
        overflow: hidden;
        border-radius: 99px;
        background: rgb(70 88 214 / 12%);
      }
      .startup-progress span {
        width: 42%;
        height: 100%;
        display: block;
        border-radius: inherit;
        background: linear-gradient(90deg, #7182ee, #4658d6);
        animation: startup-progress 1.15s ease-in-out infinite;
      }
      body.startup-ready #startup-screen { opacity: 0; visibility: hidden; }
      body.startup-ready #app { opacity: 1; }
      @keyframes startup-progress {
        from { transform: translateX(-115%); }
        to { transform: translateX(350%); }
      }
      @keyframes startup-breathe {
        0%, 100% { transform: translateY(0); filter: drop-shadow(0 14px 20px rgb(48 65 154 / 23%)); }
        50% { transform: translateY(-3px); filter: drop-shadow(0 18px 24px rgb(48 65 154 / 29%)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-mark, .startup-progress span { animation: none; }
        #startup-screen, #app { transition-duration: 1ms; }
      }
    </style>
  </head>

  <body>
    <div id="startup-screen" role="status" aria-live="polite" aria-label="书签匠正在启动">
      <div class="startup-card">
        <img class="startup-mark" src="/src/assets/app-logo.png" alt="" />
        <h1>书签匠</h1>
        <div class="startup-progress" aria-hidden="true"><span></span></div>
        <p>正在准备阅读工作区</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
