<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>书签匠</title>
    <style>
      :root { color: #281f38; background: #f1eef7; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: radial-gradient(circle at 18% 0%, #fff 0, #f2eff8 48%, #e9e4f2 100%); }
      #app { width: 100%; height: 100%; opacity: 0; transition: opacity 220ms ease; }
      #startup-screen {
        position: fixed;
        z-index: 10000;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, rgb(255 255 255 / 92%) 0, rgb(245 241 252 / 94%) 34%, transparent 68%),
          linear-gradient(145deg, #f6f3fb, #e9e3f3);
        opacity: 1;
        visibility: visible;
        transition: opacity 320ms ease, visibility 320ms step-end;
      }
      #startup-screen::before,
      #startup-screen::after {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        border: 1px solid rgb(109 69 197 / 8%);
        border-radius: 50%;
      }
      #startup-screen::before { transform: translate(-290px, -250px); }
      #startup-screen::after { transform: translate(310px, 260px) scale(.72); }
      .startup-card {
        position: relative;
        z-index: 1;
        width: 280px;
        display: grid;
        justify-items: center;
        color: #281f38;
        font-family: Inter, "Segoe UI Variable", "Microsoft YaHei UI", sans-serif;
        text-align: center;
      }
      .startup-mark {
        width: 66px;
        height: 66px;
        display: grid;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 42%);
        border-radius: 12px;
        background: linear-gradient(145deg, #8a62db, #6036b7);
        box-shadow: 0 14px 34px rgb(83 50 151 / 24%);
        color: #fff;
        font-family: SimSun, "Songti SC", serif;
        font-size: 34px;
        font-weight: 700;
        animation: startup-breathe 1.8s ease-in-out infinite;
      }
      .startup-card h1 {
        margin: 18px 0 5px;
        font-family: SimSun, "Songti SC", serif;
        font-size: 25px;
        letter-spacing: 3px;
      }
      .startup-card p { margin: 0; color: #776e85; font-size: 12px; letter-spacing: .4px; }
      .startup-progress {
        width: 168px;
        height: 3px;
        margin: 22px 0 11px;
        overflow: hidden;
        border-radius: 99px;
        background: rgb(109 69 197 / 11%);
      }
      .startup-progress span {
        width: 42%;
        height: 100%;
        display: block;
        border-radius: inherit;
        background: linear-gradient(90deg, #916ee0, #6840bd);
        animation: startup-progress 1.15s ease-in-out infinite;
      }
      body.startup-ready #startup-screen { opacity: 0; visibility: hidden; }
      body.startup-ready #app { opacity: 1; }
      @keyframes startup-progress {
        from { transform: translateX(-115%); }
        to { transform: translateX(350%); }
      }
      @keyframes startup-breathe {
        0%, 100% { transform: translateY(0); box-shadow: 0 14px 34px rgb(83 50 151 / 24%); }
        50% { transform: translateY(-3px); box-shadow: 0 18px 40px rgb(83 50 151 / 30%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-mark, .startup-progress span { animation: none; }
        #startup-screen, #app { transition-duration: 1ms; }
      }
    </style>
  </head>

  <body>
    <div id="startup-screen" role="status" aria-live="polite" aria-label="书签匠正在启动">
      <div class="startup-card">
        <div class="startup-mark" aria-hidden="true">书</div>
        <h1>书签匠</h1>
        <div class="startup-progress" aria-hidden="true"><span></span></div>
        <p>正在准备阅读工作区</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
